documentclass: article
fontsize: 12pt
linkcolor: blue
geometry:
  - top=0.7in
  - bottom=0.85in
  - left=1.1in
  - right=1.1in
  - footskip=0.35in
header-includes:
  - |
    ```{=latex}
    % Page numbering as "current/total" in the bottom-right corner.
    \usepackage{lastpage}
    \usepackage{fancyhdr}
    \pagestyle{fancy}
    \fancyhf{}
    \renewcommand{\headrulewidth}{0pt}
    % \pageref* (starred) avoids hyperlinking the total-pages reference.
    \fancyfoot[R]{\thepage/\pageref*{LastPage}}
    % Align unordered-list bullets with the paragraph left margin instead of
    % indenting them to the right.
    \usepackage{enumitem}
    \setlist[itemize]{leftmargin=1.4em,labelindent=0pt,labelsep=0.4em}
    ```
